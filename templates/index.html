```
<h1>Hari Chatbot</h1>

<p>Ask a question and listen to the answer.</p>

<form method="POST">
    <input type="text" name="question" placeholder="Ask anything" required>
    <button type="submit">Ask</button>
</form>

{% if answer %}
<script>
    window.onload = function () {

        window.speechSynthesis.cancel();

        let speech = new SpeechSynthesisUtterance("{{ answer }}");

        speech.rate = 1;
        speech.pitch = 1;
        speech.volume = 1;

        window.speechSynthesis.speak(speech);
    };
</script>
{% endif %}
```
